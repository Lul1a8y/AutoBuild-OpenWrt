#
# 2026-10-21: 只监听 LAN 地址(192.168.50.2)与本地回环, 不再监听 0.0.0.0 与 ::。
# 原配置没有 "bind to", netdata 默认对所有网卡开放, 是否放行只靠下面
# allow connections 的 IP 白名单 —— 一旦出现别的网段接口(容器/虚拟网卡/ZeroTier),
# 面板就会跟着暴露。绑到具体地址后, WAN 侧始终连不上。
# 面板地址: http://192.168.50.2:19999  (仅局域网)
#

[global]
	update every = 2
	memory deduplication (ksm) = no
	debug log = syslog
	error log = syslog
	access log = none
	run as user = root

[web]
	bind to = 192.168.50.2 127.0.0.1
	allow connections from = localhost 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.*
	allow dashboard from = localhost 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.*

[plugins]
	cgroups = no
	apps = no
	charts.d = yes
	fping = no
	node.d = no
	python.d = no

[health]
	enabled = no

[plugin:proc:ipc]
	shared memory totals = no
