name: 编译 OpenWrt 固件
on:
  workflow_dispatch:
  # 2026-10-09: 移除 push 触发器 —— 原来只挂在一个死路径(build/Tianling_source/start-up/start,
  # 该源不在 matrix 里), 等于「改了它白烧一次 5h 编译」的陷阱。去掉后提交代码不会意外触发编译,
  # 构建走手动 dispatch + 下面每 2 个月(奇数月 1 号 17:00 UTC)的定时, 节奏见 292045f。若要「提交即编译」, 把 paths 指向真实输入
  # (build/Lede_source/** 或 build/common/**) 再加回 push: 段。

  schedule:
   - cron: 0 17 1 */2 *

env:
  Github: https://github.com/${{github.repository}}
  Author: ${{github.actor}}
  Apidz: ${{github.repository}}
  Run_number: ${{github.run_number}}
  Run_workflow: ${{github.workflow}}
  # 2026-10-09: REPO_TOKEN 不再全局注入 —— 只在真正需要写权限的步骤用 step-level env 传;
  # if 条件改用下面按 secrets 计算的 HAS_REPO_TOKEN 判断(原先是每个 step 都能拿到可写 token)
  TZ: Asia/Shanghai

# 2026-10-09: 默认 GITHUB_TOKEN 收窄为只读(发布/上传走 repo 级 PAT, 不受此影响)
permissions:
  contents: read

# 2026-10-09: 同一分支串行排队(cancel-in-progress: false) —— 并发 run 会互抢 actions/cache 导致缓存保存失败
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule'
    # 2026-10-09: 冷编实测约 5h21m, GitHub 硬上限 6h → 显式 355min, 超时可控且日志有据
    timeout-minutes: 355
    outputs:
      regular_update: ${{ steps.publishmeta.outputs.regular_update }}
      has_repo_token: ${{ steps.publishmeta.outputs.has_repo_token }}
      firmware_date: ${{ steps.organizer.outputs.firmware_date }}
      ota_enabled: ${{ steps.organizer.outputs.ota_enabled }}

    name: 编译 "${{matrix.target}}"
    strategy:
      fail-fast: false
      matrix:
        target: [Lede_source]

        # 2026-10-09: 其它源(Lienol/Mortal/Tianling/openwrt_amlogic)未启用。
        # openwrt_amlogic 目录(19 文件 / 22MB 二进制)与 common/Custom/{compile,seedconfig}.sh
        # 已从仓库移除(矩阵只有 Lede_source, 它们永不参与构建); 需要 amlogic 时从上游
        # 281677160/AutoBuild-OpenWrt 取回同名目录再启用。

    steps:
    - name: 准备结束
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: 读取设置
      run: |
        source "${GITHUB_WORKSPACE}/build/${{matrix.target}}/settings.ini"
        # 2026-10-20: 开关只认字面 true/false —— 写成 ture/yes/1 时, 下游 "== true" 判断全部静默变
        # false(不报错, 只是通知/上传/发布被跳过), 排查代价极高。这里对已知开关做字面校验,
        # 写错即中止; 与现有 true/false 用法完全等价, 不改变现有行为。
        BAD_SWITCH=0
        for SW in UPLOAD_BIN_DIR UPLOAD_CONFIG UPLOAD_FIRMWARE UPLOAD_RELEASE SERVERCHAN_SCKEY REGULAR_UPDATE BY_INFORMATION; do
          VAL="${!SW-}"
          case "$VAL" in
            true|false|"") ;;
            *) echo "!! settings.ini: ${SW}=『${VAL}』不是 true/false —— 下游会静默当成 false"; BAD_SWITCH=1 ;;
          esac
        done
        [ "$BAD_SWITCH" = "0" ] || { echo "!! settings.ini 存在非法开关值, 中止(避免静默跳过上传/发布)"; exit 1; }
        # 2026-10-21: settings.ini 是用 source 解析的, 格式一走样就静默变味 ——
        #   REPO_URL="https://x  # 注释"  注释在引号内, 会跟着值一起进下游(URL 直接失效)
        #   REPO_URL=https://x  # 注释   未加引号, 值在空格处被截断
        # 这里直接检查原始文件: 只允许 KEY="VALUE", 行尾注释必须写在引号外面。
        BAD_INI=0
        LN=0
        INI="${GITHUB_WORKSPACE}/build/${{matrix.target}}/settings.ini"
        while IFS= read -r line || [ -n "$line" ]; do
          LN=$((LN+1))
          case "$line" in ''|'#'*) continue ;; [[:space:]]*'#'*) continue ;; esac
          if ! [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=\"[^\"]*\"[[:space:]]*(#.*)?$ ]]; then
            echo "!! settings.ini 第 ${LN} 行格式不对: 『${line}』"
            echo "!! 要求 KEY=\"VALUE\", 注释只能写在引号外面; 否则 source 会把注释吃进值里"
            BAD_INI=1
          fi
        done < "$INI"
        [ "$BAD_INI" = "0" ] || { echo "!! settings.ini 格式非法, 中止(避免把带注释的值传给下游)"; exit 1; }
        # 上面的格式检查看不出「注释写进引号里」这种: REPO_URL="https://x  # 注释" 的引号是配平的。
        # 所以再对 source 之后的值做一次检查: 这几个键只可能是 URL/分支名/文件名, 不该出现 # 或空白。
        for KEY in REPO_URL REPO_BRANCH CONFIG_FILE DIY_PART_SH; do
          VAL="${!KEY-}"
          if [ -z "$VAL" ] || [[ "$VAL" == *'#'* || "$VAL" == *'"'* || "$VAL" == *"'"* || "$VAL" == *[[:space:]]* ]]; then
            echo "!! settings.ini: ${KEY}=『${VAL}』为空或含 # / 引号 / 空白 —— source 解析后注释或空格进了值"
            BAD_INI=1
          fi
        done
        [ "$BAD_INI" = "0" ] || { echo "!! settings.ini 值格式非法, 中止"; exit 1; }
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "REPO_COMMIT=${REPO_COMMIT:-}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_PART_SH=${DIY_PART_SH}" >> $GITHUB_ENV
        echo "UPLOAD_BIN_DIR=${UPLOAD_BIN_DIR}" >> $GITHUB_ENV
        echo "UPLOAD_CONFIG=${UPLOAD_CONFIG}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE=${UPLOAD_FIRMWARE}" >> $GITHUB_ENV
        echo "UPLOAD_RELEASE=${UPLOAD_RELEASE}" >> $GITHUB_ENV
        echo "SERVERCHAN_SCKEY=${SERVERCHAN_SCKEY}" >> $GITHUB_ENV
        echo "REGULAR_UPDATE=${REGULAR_UPDATE}" >> $GITHUB_ENV
        echo "BY_INFORMATION=${BY_INFORMATION}" >> $GITHUB_ENV
        echo "CangKu=${Apidz##*/}" >> $GITHUB_ENV
        echo "Modelfile=${{matrix.target}}" >> $GITHUB_ENV
        # 2026-10-09: 由 secrets 计算一次供 if 条件使用(REPO_TOKEN 已从全局 env 移除)
        echo "HAS_REPO_TOKEN=${{ secrets.REPO_TOKEN != '' }}" >> $GITHUB_ENV
        # 2026-10-29: 构建 job 只拿"是否配置"的布尔值, 不拿签名私钥本身;
        # 私钥只在独立 sign job 中使用。
        echo "HAS_SIGN_KEY=${{ secrets.FIRMWARE_SIGN_KEY_B64 != '' }}" >> $GITHUB_ENV
    - name: 发布元数据
      id: publishmeta
      run: |
        echo "regular_update=${REGULAR_UPDATE}" >> "$GITHUB_OUTPUT"
        echo "has_repo_token=${HAS_REPO_TOKEN}" >> "$GITHUB_OUTPUT"
    - name: 检查签名密钥
      run: |
        # 2026-10-28: 未配置签名密钥时, 原来要等 5 小时编译完、到「云端更新1」才失败。
        # 这里提前到构建开始, 几秒内失败并指向 README。
        if [ "${REGULAR_UPDATE}" = "true" ] && [ "${HAS_SIGN_KEY}" != "true" ]; then
          echo "::error::REGULAR_UPDATE=true 但未配置 FIRMWARE_SIGN_KEY_B64"
          echo "::error::生成方法见 README.md 的「固件签名密钥」；不要提交私钥"
          exit 1
        fi
    - name: 初始化
      run: |
        chmod -R +x "${GITHUB_WORKSPACE}/build/common"
        if [[ "${REPO_BRANCH}" == "master" ]]; then
          echo "ZZZ=package/lean/default-settings/files/zzz-default-settings" >> $GITHUB_ENV
          echo "CODE=Lede" >> $GITHUB_ENV
          echo "OpenWrt_name=18.06" >> $GITHUB_ENV
        elif [[ "${REPO_BRANCH}" == "19.07" ]]; then
          echo "ZZZ=package/default-settings/files/zzz-default-settings" >> $GITHUB_ENV
          echo "CODE=Lienol" >> $GITHUB_ENV
          echo "OpenWrt_name=19.07" >> $GITHUB_ENV
        elif [[ "${REPO_BRANCH}" == "openwrt-18.06" ]]; then
          echo "ZZZ=package/emortal/default-settings/files/zzz-default-settings" >> $GITHUB_ENV
          echo "CODE=Mortal" >> $GITHUB_ENV
          echo "OpenWrt_name=18.06" >> $GITHUB_ENV
        fi
        # 2026-10-28: 版本号按构建日期生成 RYY.MM.DD(原来固定 R26.05.20, 已过期)。
        # 同一天多次构建仍由 Compile_Date 区分; post-feeds / 发布信息 / 产物自检共用此变量。
        echo "FIRMWARE_VER=R$(date +%y.%m.%d)" >> $GITHUB_ENV
        # 2026-10-20: 删除 NETIP —— 全仓库无任何地方读取它(连未启用的 Lienol/Mortal 分支都不读)
        echo "DELETE=package/base-files/files/etc/deletefile" >> $GITHUB_ENV

    - name: 释放空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        # 2026-10-17: 原写法 curl -s + 直接重定向 → 无 -f/-S/-L, 404 会把错误页、TLS 失败会把空文件
        # 写进 sources.list, 之后 apt-get update 才炸(报错还指向 apt)。改为下到临时文件 + 内容校验,
        # 校验不过就保留 runner 默认源(安全降级, 不阻断构建)。
        SRC_URL="https://us.cooluc.com/ubuntu-apt/sources-22.04.list"
        if sudo curl -fsSL --retry 3 --connect-timeout 10 "$SRC_URL" -o /tmp/sources.list \
           && [ -s /tmp/sources.list ] && grep -qE '^deb[[:space:]]' /tmp/sources.list; then
          # 2026-10-22: 只查"以 deb 开头"拦不住 deb [trusted=yes] ... —— 那等于跳过 GPG
          # 校验装任意包, 而这一步之后 apt 装的是参与编译的主机工具, 拿到就是 runner root。
          if grep -qE 'trusted=yes|allow-insecure|allow-unauthenticated' /tmp/sources.list; then
            echo "::error::镜像 apt 源带 trusted=yes/allow-insecure, 等于关闭 GPG 校验, 拒绝使用"
            exit 1
          fi
          # 明文 http 不阻断: apt 对 Release/Packages 有 GPG 校验, http 只损失传输层机密性。
          # 上游镜像本来就是 http://archive.ubuntu.com, 拦下来会让构建直接失败(实测 run #98)。
          if grep -qE '^deb[[:space:]]+\[?[^]]*\]?[[:space:]]*http://' /tmp/sources.list; then
            echo "::warning::镜像源包含明文 http 地址(apt 仍有 GPG 校验), 继续使用"
          fi
          sudo cp /tmp/sources.list /etc/apt/sources.list
          echo "== apt 源: 已切换到镜像(内容校验通过) =="
        else
          echo "::warning::镜像源获取失败或内容异常 → 保留 runner 默认源"
        fi
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        # 2026-10-17: 从清理清单里去掉 /usr/local —— 它承载 runner 的 node/python 工具链符号链接,
        # 删掉只换来一点空间, 却可能让后续 action/脚本找不到命令。其余项都是与构建无关的镜像预装件。
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: 部署环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 2026-10-09: 移除 focal 版 LLVM 源 —— 宿主是 ubuntu-22.04(jammy), 混入 focal 源会让 apt 解析到错误版本;
        # install 列表里没有任何 llvm-* 包, .config 也无 LLVM/CLANG 开关, 该源属历史残留。
        # (另: apt-key 已废弃, 删掉顺带消掉一条 deprecation 噪音)
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler ecj fakeroot fastjar flex gawk gettext genisoimage git gnutls-dev gperf haveged help2man intltool irqbalance jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lrzsz msmtp nano ninja-build p7zip p7zip-full patch pkgconf libpython3-dev python3 python3-pip python3-cryptography python3-docutils python3-ply python3-pyelftools python3-requests qemu-utils quilt re2c rsync rename scons sharutils squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto zlib1g-dev zstd xxd
        sudo apt-get clean
        echo "================================================="
        echo "文件系统        类型   容量  已用  可用 使用% 挂载点"
        df -hT $PWD
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /${{matrix.target}}
        sudo chown $USER:$GROUPS /${{matrix.target}}

    - name: 下载源码
      working-directory: /${{matrix.target}}
      run: |
        git clone -b "$REPO_BRANCH" --single-branch "$REPO_URL" openwrt
        cd openwrt
        # 2026-10-29: REPO_COMMIT 可选钉住主源码; 留空则跟随 REPO_BRANCH(默认 master)。
        if [ -n "${REPO_COMMIT:-}" ]; then
          if [ "${#REPO_COMMIT}" -ne 40 ] || [[ ! "$REPO_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "!! REPO_COMMIT 不是 40 位十六进制 SHA: ${REPO_COMMIT}"; exit 1
          fi
          git fetch --depth 1 origin "$REPO_COMMIT" || { echo "!! 主源码固定 commit 拉取失败: ${REPO_COMMIT}"; exit 1; }
          git checkout --detach "$REPO_COMMIT" || { echo "!! 主源码固定 commit 切换失败"; exit 1; }
        fi
        # 2026-10-17: 不再 > /dev/null 2>&1 吞掉输出 —— 原先网络/源失败在这里静默, 直到很久以后
        # 才以别的形式炸出来。这一处 update 是必需的: 下面「加载设置」的 diy-part.sh 要对 feeds/luci 打补丁。
        ./scripts/feeds update -a
        ln -sf /${{matrix.target}}/openwrt $GITHUB_WORKSPACE/openwrt
        echo "Home=${GITHUB_WORKSPACE}/openwrt" >> $GITHUB_ENV
        echo "PATH1=${GITHUB_WORKSPACE}/openwrt/build/${{matrix.target}}" >> $GITHUB_ENV

    - name: 加载设置
      env:
        # 2026-10-09: OpenClash 面板密码不再入库(public 仓库里明文=已泄露) —— 构建时注入:
        # 仓库 secret OPENCLASH_DASH_PASS 优先; 未配置则本次随机生成(可在路由器上 uci get 读取)
        OC_PASS_SECRET: ${{ secrets.OPENCLASH_DASH_PASS }}
      run: |
        echo "Compile_Date=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        OC_CFG="${GITHUB_WORKSPACE}/build/${{matrix.target}}/files/etc/config/openclash"
        if [ -f "$OC_CFG" ]; then
          if [ -n "$OC_PASS_SECRET" ]; then
            OC_PASS="$OC_PASS_SECRET"
            echo "== OpenClash 面板密码: 取自 secret OPENCLASH_DASH_PASS =="
          else
            OC_PASS="$(head -c 18 /dev/urandom | base64 | tr -d '/+=' | cut -c1-12)"
            echo "== OpenClash 面板密码: 本次随机生成(路由器上 uci get openclash.@config[0].dashboard_password 查看) =="
          fi
          # 密码必须是纯字母数字(否则 sed 的 | 分隔符/& 展开会写坏配置行; 随机生成的值天然满足)
          case "$OC_PASS" in
            *[!A-Za-z0-9]*) echo "!! OpenClash 面板密码只允许字母数字 —— 请把 secret OPENCLASH_DASH_PASS 改成纯字母数字"; exit 1 ;;
          esac
          grep -q 'option dashboard_password' "$OC_CFG" || { echo "!! openclash 配置缺少 dashboard_password 锚点"; exit 1; }
          sed -i "s|^\(\s*option dashboard_password\).*|\1 '${OC_PASS}'|" "$OC_CFG"
          grep -q "option dashboard_password '${OC_PASS}'" "$OC_CFG" || { echo "!! OpenClash 面板密码注入失败(secret 含特殊字符? 请用纯字母数字)"; exit 1; }
          grep -q 'CHANGE_ME_BUILD_TIME' "$OC_CFG" && { echo "!! openclash 配置残留占位密码"; exit 1; }
          echo "== OpenClash 面板密码注入完成 =="
        fi
        cp -Rf `find ./ -maxdepth 1 -type d ! -path './openwrt' ! -path './.git' ! -path './'` openwrt
        mv -f "${Home}"/build/common/*.sh "${PATH1}"
        # 2026-10-09: feeds 之后的修补统一在 post-feeds.sh(单一定义, 幂等); 未就位即中止, 不留静默缺口
        [ -f "${PATH1}/post-feeds.sh" ] || { echo "!! post-feeds.sh 未随 build/common/*.sh 就位"; exit 1; }
        source "${PATH1}/common.sh" && Diy_settings
        # 2026-10-28: 原来这里读取 github.event.inputs.ssh, 但 workflow_dispatch 没有定义
        # ssh 输入, 也没有对应的 SSH 步骤 —— 是死引用(actionlint 会报 property "ssh" 未定义)。
        # 需要 SSH 调试时再单独加 inputs.ssh + tmate/ssh 步骤; 现在先删掉误导性代码。
        cd openwrt
        if [[ "${REPO_BRANCH}" == "master" ]]; then
          source "${PATH1}/common.sh" && Diy_lede
        elif [[ "${REPO_BRANCH}" == "19.07" ]]; then
          source "${PATH1}/common.sh" && Diy_lienol
        elif [[ "${REPO_BRANCH}" == "openwrt-18.06" ]]; then
          source "${PATH1}/common.sh" && Diy_Tianling
        elif [[ "${REPO_BRANCH}" == "openwrt-21.02" ]]; then
          source "${PATH1}/common.sh" && Diy_mortal
        fi
        source "${PATH1}/common.sh" && Diy_all
        /bin/bash "${PATH1}/$DIY_PART_SH"
        # 2026-10-17: 删掉这里的重复 feeds update —— 全程没有任何地方改 feeds.conf(已核), 上一次
        # update(下载源码步骤)已把 feed 拉到最新; 此处再 update 只会在 diy-part 打完补丁后再 git pull
        # 一次, 既慢又可能还原删除类改动。feeds install 保留原位, 不需要再刷新 feed 内容。
        # 2026-10-09: 原先内联在这里的 argon/编译日期/版本钉死/AutoUpdate加固 已合并到 post-feeds.sh
        # (与「修复缓存覆盖」曾是两份重复文本; 该文件幂等, 两处调用同一份定义)
        bash "${PATH1}/post-feeds.sh"
        # 2026-10-21: 去掉前面那次 `feeds install -a`(输出还被 /dev/null 吞掉) —— 紧接着的
        # `-a -f` 本来就是"全量 + 强制覆盖", 同样的活儿再干一遍纯属浪费; 且第一次失败时
        # 没人看得见, 真正的结果由 -f 决定。buildroot 的 feeds install 只是建 package/feeds
        # 下的软链, 不存在"必须先无 -f 跑一遍才能 -f"的依赖。
        ./scripts/feeds install -a -f
        mv "$PATH1/$CONFIG_FILE" .config
        # 2026-10-09: .config 就位后再跑一次 post-feeds.sh —— 补 .config 里 vsftpd/clashoo 反选,
        # 并再防一次 feeds install -a -f 把 feed 源码还原(函数内所有操作幂等)
        bash "${PATH1}/post-feeds.sh"

        if [[ "${REGULAR_UPDATE}" == "true" ]]; then
          source "${PATH1}/upgrade.sh" && Diy_Part1
        fi

    - name: 记录构建来源
      run: |
        # 2026-10-09: 记录本例固件的可追溯信息(随 release 一起发布, 事后可核对源码/配置)
        cd openwrt
        {
          echo "AutoBuild-OpenWrt commit: ${GITHUB_SHA}"
          echo "workflow run: ${Github}/actions/runs/${{ github.run_id }}"
          echo "Compile_Date: ${Compile_Date}   FIRMWARE_VER: ${FIRMWARE_VER}"
          echo "config sha256: $(sha256sum .config | awk '{print $1}')"
          echo "lede commit: $(git rev-parse HEAD) ($(git log -1 --format=%cI))"
          # 2026-10-17: 补目标/架构/内核 pin —— 原先只记 commit, 事后分不清这版是 6.6 还是 6.18
          echo "target/profile: (见下方 make defconfig 之后补记)"
          echo "kernel: $(grep -m1 '^KERNEL_PATCHVER' target/linux/x86/Makefile 2>/dev/null || echo '(未 pin)')  testing: $(grep -m1 '^KERNEL_TESTING_PATCHVER' target/linux/x86/Makefile 2>/dev/null)"
          echo "--- feeds / 第三方源 commit ---"
          for d in feeds/* package/kenzok8 package/kenzok8-small package/openclash package/helloworld feeds/luci/applications/luci-app-autoupdate; do
            [ -d "$d/.git" ] || continue
            echo "$d: $(git -C "$d" rev-parse HEAD 2>/dev/null)"
          done
          if [ -f "${GITHUB_WORKSPACE}/SOURCE_EXTRA.txt" ]; then
            cat "${GITHUB_WORKSPACE}/SOURCE_EXTRA.txt"
          fi
          if [ -f "${GITHUB_WORKSPACE}/build/Lede_source/files/etc/openclash/core/clash_meta" ]; then
            echo "clash_meta: $(sha256sum "${GITHUB_WORKSPACE}/build/Lede_source/files/etc/openclash/core/clash_meta" | cut -d' ' -f1) (prebuilt; upstream tag not recorded)"
          fi
        } > "${GITHUB_WORKSPACE}/BUILD_SOURCE.txt"
        # 2026-10-28: 在编译前把源码快照固定下来并上传 artifact。
        # 这样即使编译阶段的 Makefile 被上游注入, 事后也能核对"当时到底用了哪些 commit";
        # 不改变"每次跟上游最新"的行为, 只是把快照变成不可被构建阶段改写的副本。
        cat "${GITHUB_WORKSPACE}/BUILD_SOURCE.txt"

    - name: 生成配置
      run: |
        cd openwrt
        source "${PATH1}/common.sh" && Diy_chajian > /dev/null 2>&1
        # 2026-10-17: 不再吞掉 defconfig 输出 —— 它失败时 .config 会保持旧状态, 后面却照常编译。
        make defconfig || { echo "!! make defconfig 失败"; exit 1; }
        # 2026-10-21: 防"包被静默跳过"。buildroot 只收录 Makefile 里含 "call BuildPackage"
        # 字样的包(include/scan.mk), 缺了就不进 tmp/.packageinfo, .config 写 =y 也没用、
        # 不报错、固件里就是没有 —— 10-20 那版 ADH 就是这么消失的。
        # 这里对关键包做收录断言, 失败即中止(发生在编译前, 代价几分钟)。
        for p in luci-app-adguardhome luci-app-openclash luci-app-mosdns luci-app-passwall; do
          grep -q "$p" tmp/.packageinfo || {
            echo "!! $p 未被 buildroot 收录(scan.mk 跳过), 检查其 Makefile 是否含 'call BuildPackage'"
            grep -rn "PKG_NAME" package/kenzok8/$p/Makefile 2>/dev/null | head -3
            exit 1
          }
        done
        # 2026-10-27: 上面只证明"包被收录", 不证明"被选中"。defconfig 碰到依赖不满足会
        # 把 CONFIG_PACKAGE_x 直接丢掉(不报错), 固件里就少这个包。这里断言 defconfig 之后的
        # 最终 .config, 与种子文件里的 =y 逐项对齐(列的都是 build/Lede_source/.config 里显式选中的
        # 核心组件, 一旦被丢说明依赖链断了, 应当中止而不是产出一个残缺固件)。
        # 2026-10-28: luci-app-autoupdate 的源码只在 REGULAR_UPDATE=true 时 clone(common.sh:74-79),
        # 关掉 OTA 时 defconfig 会丢掉 =y —— 无条件断言会让合法开关值不可构建。改为
        # "源码在就必须被选中"。kmod-drm-i915 也列进来: 它一旦被 defconfig 丢掉, 下面 i915 段
        # 会整段跳过并只打 warning, 固件少了模块却 CI 绿色。
        # 2026-10-28: 补上 passwall 的两个透明代理变体。它们是子选项(不是独立包), 一旦上游
        # 改名/合并, defconfig 会把它们静默丢掉 —— 而 kmod-nft-socket/kmod-nft-tproxy 与
        # kmod-ipt-nat 全靠这两个 select, 丢了就是"代理能连但流量不转发"或"53 劫持失效",
        # 这种残废固件比构建失败更难查, 所以这里宁可红。
        ASSERT_PKGS="luci-app-adguardhome luci-app-openclash luci-app-mosdns luci-app-passwall"
        ASSERT_PKGS="$ASSERT_PKGS luci-app-passwall_Nftables_Transparent_Proxy"
        ASSERT_PKGS="$ASSERT_PKGS luci-app-passwall_Iptables_Transparent_Proxy"
        ASSERT_PKGS="$ASSERT_PKGS luci-app-ttyd mosdns sing-box chinadns-ng kmod-drm-i915"
        # wget-ssl: 升级/换源两条通道都靠它下载(实测 uclient-fetch 抓 GitHub release 超时),
        # 它本身不是显式依赖, 被 defconfig 丢掉时只会表现为"下载失败", 所以一并断言。
        ASSERT_PKGS="$ASSERT_PKGS wget-ssl"
        if [ -d feeds/luci/applications/luci-app-autoupdate ]; then
          ASSERT_PKGS="$ASSERT_PKGS luci-app-autoupdate"
        fi
        for p in $ASSERT_PKGS; do
          grep -q "^CONFIG_PACKAGE_${p}=y$" .config || {
            echo "!! ${p} 未出现在最终 .config(=y) —— 依赖不满足被 defconfig 丢弃"
            grep -n "PACKAGE_${p}\\b" tmp/.packageinfo | head -3
            exit 1
          }
        done
        # 2026-10-28: 可选/桌面组件只做软告警, 不阻断构建。上游改名/删包时
        # 至少日志里能看到, 避免"README 说有、固件里没有"却完全无声。
        # 核心包仍由上面的 ASSERT_PKGS 硬断言。
        for p in luci-app-openlist openlist luci-app-diskman luci-app-partexp \
                 luci-app-zerotier luci-app-netdata luci-app-filetransfer \
                 luci-theme-argon luci-app-ssr-plus; do
          grep -q "^CONFIG_PACKAGE_${p}=y$" .config || \
            echo "::warning::${p} 未出现在最终 .config(=y), 可能被上游改名/删除或被 defconfig 丢弃"
        done
        echo "== 关键包收录断言通过 =="
        ./scripts/diffconfig.sh > ${GITHUB_WORKSPACE}/config.txt
        # 2026-10-18: 此处的 .config 才是 defconfig 之后的完整配置; 记录来源那一步的 .config 只是片段
        {
          echo "target: $(awk -F '[=\"]+' '/^CONFIG_TARGET_BOARD=/{print $2}' .config)/$(awk -F '[=\"]+' '/^CONFIG_TARGET_SUBTARGET=/{print $2}' .config)  profile: $(awk -F '[=\"]+' '/^CONFIG_TARGET_PROFILE=/{print $2}' .config)"
          echo "config sha256(final): $(sha256sum .config | awk '{print $1}')"
        } >> ${GITHUB_WORKSPACE}/BUILD_SOURCE.txt
        echo "TARGET_BOARD=$(awk -F '[="]+' '/TARGET_BOARD/{print $2}' .config)" >> $GITHUB_ENV
        echo "TARGET_SUBTARGET=$(awk -F '[="]+' '/TARGET_SUBTARGET/{print $2}' .config)" >> $GITHUB_ENV
        if [ `grep -c "CONFIG_TARGET_x86_64=y" .config` -eq '1' ]; then
         echo "TARGET_PROFILE=x86-64" >> $GITHUB_ENV
        elif [ `grep -c "CONFIG_TARGET_x86_generic=y" .config` -eq '1' ]; then
         echo "TARGET_PROFILE=x86-32" >> $GITHUB_ENV
        elif [ `grep -c "CONFIG_TARGET.*DEVICE.*=y" .config` -eq '1' ]; then
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "TARGET_PROFILE=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        else
          echo "TARGET_PROFILE=armvirt" >> $GITHUB_ENV
        fi
        cp "${GITHUB_WORKSPACE}/BUILD_SOURCE.txt" "${GITHUB_WORKSPACE}/SOURCE_LOCK.txt"

    - name: 上传源码快照
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: build-source-${{ env.Compile_Date }}
        path: |
          BUILD_SOURCE.txt
          SOURCE_LOCK.txt
        if-no-files-found: error
        retention-days: 30

    - name: 编译信息
      run: |
        cd openwrt
        source "${PATH1}/common.sh" && Diy_chuli > /dev/null 2>&1
        # 2026-10-29: nanopi/armvirt 不支持 OTA。原逻辑在 Diy_xinxi 里改 shell 变量，
        # 那时 Diy_Part2 已跑完，等于无效；这里在复制 AutoUpdate 之前生效，并写回 GITHUB_ENV。
        if [[ "${TARGET_PROFILE}" =~ (friendlyarm_nanopi-r2s|friendlyarm_nanopi-r4s|armvirt) ]]; then
          REGULAR_UPDATE=false
          echo "REGULAR_UPDATE=false" >> "$GITHUB_ENV"
        fi
        if [ "${REGULAR_UPDATE}" == "true" ]; then
          source "${PATH1}/upgrade.sh" && Diy_Part2 > /dev/null 2>&1
        fi
        if [ "${BY_INFORMATION}" == "true" ]; then
          source "${PATH1}/upgrade.sh" && GET_TARGET_INFO
          source "${PATH1}/common.sh" && Diy_xinxi
          # 2026-10-17: 删掉 chmod -R 755 .(整树递归改权限, 上万文件 + 抹掉可执行位差异);
          # Diy_xinxi 只 echo 编译信息、不写任何文件(已核 common.sh 全文), 不需要兜权限。
        fi
    - name: 电报通知
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c > CPU
        cat /proc/cpuinfo | grep "cpu cores" | uniq >> CPU
        sed -i 's|[[:space:]]||g; s|^.||' CPU && sed -i 's|CPU||g; s|pucores:||' CPU
        CPUNAME="$(awk 'NR==1' CPU)" && CPUCORES="$(awk 'NR==2' CPU)"
        curl --data chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data "text=🔔 您正在使用【${CPUNAME} CPU】【${CPUCORES}核心】【${CODE}】源码 编译固件中,请耐心等待...... ⏳" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          || echo "::warning::电报通知发送失败(不影响固件与发布)"

    - name: 加载缓存
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        # 2026-09-04: 原整树缓存(openwrt/)编译后 >10GB 超 GitHub cache 单条上限 → 保存必失败;
        # key 的 hashFiles('**/openwrt/Makefile') 因 openwrt 是 symlink 恒空 → restore 永远 miss
        # → 每次 3-4h 冷编。改为只缓存 dl/(源码包) + staging_dir/(toolchain+编译产物), 用真实路径避开 symlink。
        # 2026-10-09: key 增加 .config/settings.ini 指纹(固定 key 会让旧缓存永不失效; hashFiles 必须写显式路径,
        # 点开头的 .config 不会被 ** 通配到); 另加 restore-keys 前缀 → 指纹变化时仍能部分命中, 不必从零下 dl。
        # 刻意不把源码 commit 放进 key: 上游每次 bump 都会全冷编(冷编 5h21m 已逼近 6h 上限)。
        # 2026-10-20: 刻意不缓存 dl/go-mod-cache(Go 模组下载缓存)。
        # run 39409842961 的 geoview 失败就是这个目录: 它是 10-09 保存时下载到一半的残缺缓存,
        # 里面 sagernet/sing@v0.8.9 缺 common/debug、common/x/collections 等子包,
        # protobuf@v1.36.11 缺 internal/editiondefaults → "no required module provides package"。
        # 这类缓存无法在 restore 时校验完整性, 一旦坏掉会以"某个 go 包编译失败"的形式反复出现,
        # 且每次都白白烧掉 2-3 小时。模组重新下载只需几分钟, 用确定性换这点时间划算。
        path: |
          /${{ matrix.target }}/openwrt/dl
          !/${{ matrix.target }}/openwrt/dl/go-mod-cache
          /${{ matrix.target }}/openwrt/staging_dir
        key: ${{ runner.os }}-${{ matrix.target }}-openwrt-${{ hashFiles(format('build/{0}/.config', matrix.target), format('build/{0}/settings.ini', matrix.target), 'build/common/**', format('build/{0}/files/**', matrix.target), format('build/{0}/diy-part.sh', matrix.target)) }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-openwrt-

    - name: 判断缓存复用
      id: cachecheck
      run: |
        # 2026-10-09: 用 staging_dir/toolchain 是否真实存在判断"可增量", 不再只认 cache-hit 输出
        # (指纹 key 变化时是 restore-keys 部分命中: cache-hit=false 但 toolchain 其实可用 → 不该走冷编保险路径)
        # 2026-10-17: 但"目录存在"不等于"这份 toolchain 匹配本次配置" —— restore-keys 是前缀匹配,
        # .config 一改仍会把旧 staging_dir 整树恢复回来。故加构建指纹(与缓存 key 同一输入):
        #   staging_dir/.hermes-build-fingerprint 与本次指纹不一致 → 清 toolchain, 安全降级走冷编。
        # 注意: 不把 lede commit 放进 key/指纹 —— 上游每次 bump 都全冷编(5h21m 已逼近 6h 上限)。
        # 2026-10-20 修(第二轮): 指纹之前一直读 "${PATH1}/.config", 但「加载设置」里已执行
        #   mv "$PATH1/$CONFIG_FILE" .config
        # 该文件被搬进 openwrt/ 了, 所以这里永远"缺失" → 指纹恒为 unknown → 每次都走
        # 「旧缓存 → 按增量处理」分支 → 10-09 那份旧 staging_dir + dl/go-mod-cache 被永远复用。
        # 这就是 run 39409842961 里 geoview 报
        #   "no required module provides package github.com/sagernet/sing/common/debug"
        # 的直接原因: go-mod-cache 是 10-09 保存的、下载到一半的残缺模组缓存。
        # 现改为与缓存 key 完全相同的输入(仓库内的原始 build/<target>/ 副本, 未被 mv 动过),
        # 保证「key 变 ⇔ 指纹变」两者不会脱节。
        SRC_DIR="${GITHUB_WORKSPACE}/build/${{ matrix.target }}"
        if [ -f "${SRC_DIR}/.config" ] && [ -f "${SRC_DIR}/settings.ini" ]; then
          CACHE_FP="$(
            {
              cat "${SRC_DIR}/.config"
              cat "${SRC_DIR}/settings.ini"
              find "${GITHUB_WORKSPACE}/build/common" "${SRC_DIR}/files" "${SRC_DIR}/diy-part.sh" -type f -print0 2>/dev/null \
                | sort -z | xargs -0 sha256sum
            } | sha256sum | awk '{print $1}'
          )"
        else
          CACHE_FP="unknown"
          echo "::warning::指纹输入缺失(config=$([ -f "${SRC_DIR}/.config" ] && echo 有 || echo 无) settings=$([ -f "${SRC_DIR}/settings.ini" ] && echo 有 || echo 无)) → 记 unknown"
        fi
        echo "CACHE_FP=$CACHE_FP" >> $GITHUB_ENV
        echo "== 本次构建指纹: ${CACHE_FP:0:16} =="
        SD="/${{ matrix.target }}/openwrt/staging_dir"
        if ls "$SD"/toolchain-* >/dev/null 2>&1; then
          if [ -f "$SD/.hermes-build-fingerprint" ]; then
            OLD_FP="$(cat "$SD/.hermes-build-fingerprint")"
            if [ "$OLD_FP" = "$CACHE_FP" ]; then
              echo "hit=true" >> $GITHUB_OUTPUT
              echo "== 指纹一致 + toolchain 已恢复 → 增量编译 =="
            else
              # 2026-10-18: 不再在这里 rm toolchain。只清 staging_dir/toolchain-* 而不清
              # build_dir/toolchain-* 会留下 .built 戳记, 下次 make 认为已编好 → binutils 链接期失败
              # (正是 9/5 的老坑)。失配只告警, 实际清理交给编译步骤里已有的降级路径。
              echo "::warning::缓存指纹不一致(${OLD_FP:0:16} ≠ ${CACHE_FP:0:16}) → 告警, 交编译步骤自行降级"
              echo "hit=true" >> $GITHUB_OUTPUT
            fi
          else
            # 2026-10-20: 旧缓存(10-09 那份)没写指纹文件, 无法校验, 仍按增量走 —— 冷编 5h21m
            # 贴着 355min 上限, 不能为了"可能的不一致"就放弃缓存。一致性由「编译固件」里
            # 强制丢弃 dl/go-mod-cache 来兜底(见该步骤注释)。
            echo "::warning::缓存里没有指纹文件(旧缓存) → 本次按增量处理, 成功后补写"
            echo "hit=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "hit=false" >> $GITHUB_OUTPUT
          echo "== 未发现 toolchain → 冷编保险路径 =="
        fi
    - name: 修复缓存覆盖
      run: |
        cd openwrt
        # 2026-10-09: 与「加载设置」共用同一份修补定义(post-feeds.sh), 幂等; 缓存恢复会还原源码树
        bash "${PATH1}/post-feeds.sh"


    - name: 下载dl库
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # ===== 9/5 binutils 修复背景(勿删) =====
        # run1-4 binutils 冷编均链接期失败(undefined __sprintf_chk/fopen64);
        # 根治: binutils 是 host 工具, 编译期间不许存在 musl sysroot
        # (musl 并行先完成 → 链接命中 musl libc; 或 sysroot include 残留
        #  musl 头 → off64_t 缺失). 整体清空 → binutils 纯 glibc 编译,
        # .built 落定后全量阶段 musl 重建 sysroot, 互不干扰.
        # 但无条件清空会让"缓存命中"场景也退化冷编(9/4 缓存健康时仅 433 行
        # 增量日志 vs 9/5 后每次 5 万行+~1h toolchain 重编) → 现改为按
        # cache-hit 分支: 命中直接增量; miss(真冷编)才走保险路径; 命中后
        # make 失败(如 lede 上游动 go 包/go.sum 错配)自动降级保险路径重来.
        echo '== toolchain env =='
        gcc --version | head -1
        ld --version | head -1
        ls -la staging_dir/host/bin/gcc 2>/dev/null || echo '(host gcc 尚未创建)'
        # ===== 2026-10-20: binutils 预编译(两条路径共用) =====
        # 依据 run 39368545991: 缓存命中的第一次 make -j4 在 23min 处报
        #   "ERROR: toolchain/binutils failed to build."
        # 机制(9/5 已定性): binutils 是 host 工具, 必须链编译机的 glibc; 并行时 musl
        # 先把 staging_dir/toolchain-*_musl sysroot 建出来 → binutils 链接期吃到 musl
        # 头/库 → undefined __sprintf_chk / fopen64. 老脚本靠降级 -j1 串行绕开(4 核变
        # 1 核, 就是 10/19 那次 5h41 的来源). 现改为: 先把 binutils 单独串行编好并落
        # .built 戳记, 再开并行 —— 竞态不成立, 且不用牺牲全局并行度.
        rm -f build.log
        # ===== 2026-10-20: 丢弃 Go 模组缓存 =====
        # run 39409842961: geoview 两次都死在
        #   dl/go-mod-cache/github.com/sagernet/sing@v0.8.9/common/buf/buffer.go:10:2:
        #   no required module provides package github.com/sagernet/sing/common/debug
        # 即缓存里那份 sing@v0.8.9 是残缺的(子包目录没解出来)。这个目录是纯派生物,
        # 每次构建都重新下载, 几行日志的代价, 换掉整个"go 包莫名编译失败"故障类。
        # 注意必须放在 binutils 预编译之前, 且 dl/go-mod-cache 已从缓存路径里排除。
        rm -rf dl/go-mod-cache
        if ls build_dir/toolchain-*/binutils-*/.built >/dev/null 2>&1; then
          echo '== binutils .built 已存在, 跳过预编译 =='
        else
          echo '== binutils 预编译: 清 musl sysroot 后串行 V=s =='
          rm -rf build_dir/toolchain-*_*/binutils-*
          rm -rf staging_dir/toolchain-*_musl
          make toolchain/binutils/compile V=s 2>&1 | tee -a build.log || true
          if ! ls build_dir/toolchain-*/binutils-*/.built >/dev/null 2>&1; then
            echo '!! binutils 预编译后仍无 .built, 中止; 最后 30 行:' >&2
            tail -30 build.log >&2
            exit 1
          fi
        fi

        echo '== 并行编译 world =='
        set -o pipefail
        make -j$(nproc) 2>&1 | tee -a build.log || {
          echo '== 并行编译失败, 错误现场(最后 20 条): =='
          grep -aE "Error [0-9]+|error:|undefined reference|No such file|failed to|Temporary failure" build.log | tail -20 || true
          echo '== 降级: 清 go-mod-cache+musl sysroot, binutils 串行后再并行 =='
          rm -rf dl/go-mod-cache
          rm -rf build_dir/toolchain-*_*/binutils-*
          rm -rf staging_dir/toolchain-*_musl
          make toolchain/binutils/compile V=s 2>&1 | tee -a build.log || true
          make -j$(nproc) V=s 2>&1 | tee -a build.log
        }
        # 2026-10-17: 指纹写进 staging_dir(随缓存一起保存), 供下次 restore-keys 部分命中时比对
        echo "${CACHE_FP}" > staging_dir/.hermes-build-fingerprint
        echo "status=success" >> $GITHUB_ENV
        echo "date=$(date "+%Y%m%d%H%M%S")" >> $GITHUB_ENV
        echo "date1=$(date +'%m-%d')" >> $GITHUB_ENV

    - name: 构建产物自检
      if: env.status == 'success'
      run: |
        # 2026-10-09: 只对"我们自己写入的保证"做硬断言(版本字面量 / luci flag / i915 模块 / Firmware Date 行数);
        # 纯结构性假设(路径是否存在)只告警不判失败 —— 免得上游目录结构变化时误杀一次 5h+ 的编译
        cd openwrt
        ROOTDIR="$(ls -d build_dir/target-*/root-* 2>/dev/null | head -1)"
        if [ -z "$ROOTDIR" ]; then
          # 2026-10-28: 原来是 exit 0 —— 步骤算成功、env.status 仍是 success, 后面
          # 「整理文件/上传/发布/云端更新」照常跑, 版本字面量、ucode、i915、Firmware Date、
          # gzip、sha256sums 六类断言全部静默跳过, 等于发一份没校验过的固件。
          echo "::error::未找到 build_dir/target-*/root-*, 无法校验产物, 拒绝发布"
          echo "status=failed" >> "$GITHUB_ENV"
          exit 1
        fi
        echo "== 产物自检 root: $ROOTDIR =="
        REL="$ROOTDIR/etc/openwrt_release"; OSR="$ROOTDIR/usr/lib/os-release"
        if [ -f "$REL" ]; then
          grep -q "DISTRIB_RELEASE='${FIRMWARE_VER}'" "$REL" || { echo "!! 产物 openwrt_release 版本未钉死为 ${FIRMWARE_VER}"; exit 1; }
        else
          echo "::warning::产物缺 $REL, 跳过版本断言"
        fi
        if [ -f "$OSR" ]; then
          grep -q "OPENWRT_RELEASE=\"LEDE ${FIRMWARE_VER}\"" "$OSR" || { echo "!! 产物 os-release 版本未钉死为 ${FIRMWARE_VER}"; exit 1; }
        else
          echo "::warning::产物缺 $OSR, 跳过版本断言"
        fi
        LUCI_UC="$ROOTDIR/usr/share/rpcd/ucode/luci"
        if [ -f "$LUCI_UC" ]; then
          if grep -qE '\$/[a-z]*[sm]' "$LUCI_UC"; then
            echo "!! 产物 luci ucode 残留 s/m flag(会导致 LuCI -32000 Object not found)"; exit 1
          fi
          grep -q 'getFeatures' "$LUCI_UC" || { echo "!! 产物 luci ucode 缺 getFeatures 段"; exit 1; }
          echo "== 产物 luci ucode flag OK =="
        else
          echo "::warning::产物内未找到 rpcd/ucode/luci(上游结构变化?)"
        fi
        # 2026-10-13: 断言改为按「实际选择」触发。原来 grep '^CONFIG_DRM_I915=m' .config 是空转的 ——
        # .config 里从来没这一行(用的是 CONFIG_PACKAGE_kmod-drm-i915=y, 内核符号由 kmod 包推导),
        # 于是每次都落到 warning 分支, 换了内核也没人拦。判据改为:
        #   (a) 选了 kmod-drm-i915 就必须在产物里找到 i915.ko —— 有 .ko 即证明是模块而非内建(=y 才会开机卡 64s);
        #   (b) 若能定位内核构建目录的 .config, 交叉确认 CONFIG_DRM_I915=m(找不到只告警, 不误杀 5h 编译)。
        if grep -q '^CONFIG_PACKAGE_kmod-drm-i915=y' .config; then
          if find "$ROOTDIR/lib/modules" -name 'i915.ko*' -print -quit 2>/dev/null | grep -q .; then
            echo "== i915 以模块打包 OK(开机卡 64s 的修复仍在) =="
          else
            echo "!! 选了 kmod-drm-i915 但产物缺 i915.ko(内建=开机可能卡 64s)"; exit 1
          fi
          KC="$(find build_dir -name .config -path '*linux-*' -print -quit 2>/dev/null)"
          if [ -n "$KC" ]; then
            if grep -q '^CONFIG_DRM_I915=m' "$KC"; then
              echo "== 内核 config 交叉确认 CONFIG_DRM_I915=m ($KC) =="
            else
              echo "!! 内核 $KC 里不是 CONFIG_DRM_I915=m:"; grep -m2 '^CONFIG_DRM_I915' "$KC" || echo "(无该符号)"; exit 1
            fi
          else
            echo "::warning::未找到内核构建 .config, 跳过 i915 交叉确认"
          fi
        else
          echo "::warning::.config 未选 kmod-drm-i915, 未校验 i915 模块"
        fi
        JSN="$(find "$ROOTDIR" -path '*status/include/10_system.js' -print -quit 2>/dev/null)"
        if [ -n "$JSN" ]; then
          CNT="$(grep -c 'Firmware Date' "$JSN" || true)"
          if [ "$CNT" = "1" ]; then
            echo "== 概览页 Firmware Date 注入恰好 1 处 =="
          else
            echo "!! 概览页 Firmware Date 注入异常(出现 ${CNT} 次, 应为 1 次)"; exit 1
          fi
        else
          echo "::warning::产物内未找到 10_system.js, 跳过概览页注入检查"
        fi
        # ===== 2026-10-17: 关键产物硬断言 =====
        # 原缺口: 全流程没有任何一处断言"镜像真的产出了", 而发布步骤用 artifacts: Firmware/* 通配,
        # 于是目录空也能"发布成功"。这里在镜像还在 bin/targets 时就卡死。
        IMGS="$(ls bin/targets/*/*/*combined*.img.gz 2>/dev/null || true)"
        [ -n "$IMGS" ] || { echo "!! 未产出 *combined*.img.gz"; ls -l bin/targets/*/*/ 2>/dev/null | head -20; exit 1; }
        # 2026-10-20: 用固定名 + trap 清理, 不用 mktemp -u(名字先返回后创建, 存在竞态);
        # 该 runner 只跑本 job, 固定名足够, 且退出时必定清理。
        OUT_IMG="/tmp/openwrt-image-check.$$.img"
        trap 'rm -f "$OUT_IMG"' EXIT
        for f in $IMGS; do
          SZ="$(stat -c %s "$f")"
          [ "$SZ" -ge 52428800 ] || { echo "!! $f 体积异常(${SZ}B < 50MB, 可能截断)"; exit 1; }
          # 2026-10-20: run 39368545991 在 "gzip -t" 上报 "decompression OK, trailing garbage ignored"
          # 并判失败, 白丢一次 5h 构建。gzip -t 只在「解压过程中」校验 CRC/长度, 所以它同时会放过
          # 「帧本身完好、但文件被追加了垃圾」的情况; 而 gzip -dc 在尾随字节非零时可能直接报错并丢弃
          # 已解出内容(gzip 1.12 实测: 尾随 "GARBAGE" → -dc 返回非零; 尾随 \0 才被忽略)。
          # 故判据改为「能把镜像完整解出来」: 先解压到磁盘, 要求退出 0 且非空; 只有解压失败时才回退
          # 到 gzip -t 区分「可解压但尾随垃圾(告警放行)」与「真损坏(硬失败)」。正常路径(无损)下
          # 与旧判据等价, 不改变任何现有行为。
          if gzip -dc "$f" > "$OUT_IMG" 2>/dev/null && [ -s "$OUT_IMG" ]; then
            rm -f "$OUT_IMG"
            echo "== 镜像 OK: $f ($((SZ/1024/1024))MB, 可完整解压) =="
          else
            rm -f "$OUT_IMG"
            # 本地实测(gzip 1.12): 尾随垃圾时 -dc 退 2 且已丢出完整内容, 需按 gzip -t 的提示区分;
            # 截断/CRC 错误两处都不通过 → 仍硬失败。四种形态(完好/尾随垃圾/截断/CRC)已离线验证。
            GZ_MSG="$(gzip -t "$f" 2>&1 || true)"
            if printf '%s' "$GZ_MSG" | grep -q 'trailing garbage ignored'; then
              echo "::warning::$f 尾部有多余字节(gzip: trailing garbage ignored), 解压内容完整 → 判为可用"
              echo "== 镜像 OK(容忍尾随字节): $f ($((SZ/1024/1024))MB) =="
            else
              echo "!! $f gzip 完整性校验失败: ${GZ_MSG:-gzip -t 无输出}"; exit 1
            fi
          fi
        done
        SUMS="$(ls bin/targets/*/*/sha256sums 2>/dev/null | head -1)"
        [ -n "$SUMS" ] || { echo "!! 未产出 sha256sums"; exit 1; }
        ( cd "$(dirname "$SUMS")" && sha256sum -c sha256sums --ignore-missing --quiet ) || { echo "!! sha256sums 校验失败"; exit 1; }
        echo "== sha256sums 校验通过 =="
        echo "== 产物自检通过 =="

    - name: 上传配置
      if: env.UPLOAD_CONFIG == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: .config_${{ env.CODE }}_${{ env.TARGET_PROFILE }}_${{ env.Compile_Date }}
        path: config.txt
        # 2026-10-28: 默认只告警。config.txt 由 diffconfig.sh 生成, 它失败时该步骤会是空的
        # 而整次构建仍绿 —— 上传类步骤统一改成缺文件即失败。
        if-no-files-found: error

    - name: 上传文件
      if: env.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: filename+ipk_${{ env.CODE }}_${{ env.TARGET_PROFILE }}_${{ env.Compile_Date }}
        path: openwrt/bin
        if-no-files-found: error

    - name: 整理文件
      id: organizer
      run: |
        cd openwrt
        echo "文件系统        类型   容量  已用  可用 使用% 挂载点"
        df -hT $PWD
        # 2026-10-29: packages/ 只用于 ipk 上传(前面已归档), 不参与升级/发布;
        # 先删掉再复制, 避免把整份 ipk 复制到 ${Home}/upgrade 后一直留着。
        rm -rf bin/targets/*/*/packages
        cp -Rf bin/targets/*/* "${Home}"/upgrade
        cd bin/targets/*/*
        # 2026-10-09: 保留 *sha256sums*/*manifest*/*buildinfo*(体积小, 发布后可核对校验和与包清单);
        # 原先一并删除 → release 里没有任何可校验文件。仅继续剔除重复的大体积镜像。
        find . \( -name "*vmlinuz*" -o -name "*Image*" -o -name "*rootfs.img.gz*" -o -name "*kernel.bin*" \) -exec rm -rf {} +
        rm -rf packages
        rename -v "s/^openwrt/${{ env.date1 }}-${{ env.CODE }}/" *
        # 2026-10-24: 上面的 sha256sums 是在改名之前校验的, 清单里记的还是 openwrt-* 老名字;
        # rename 后清单与文件对不上, 用户 `sha256sum -c sha256sums` 必然 No such file or directory。
        # 改名后按最终文件名重算一遍再发布。
        if [ -f sha256sums ]; then
          sha256sum *.img.gz > sha256sums
          sha256sum -c sha256sums --quiet || { echo "!! 改名后重算 sha256sums 自检失败"; exit 1; }
          echo "== sha256sums 已按最终文件名重算 =="
        fi
        # 2026-10-17: rename 之后再确认一次(发布/上传都用通配, 空目录也会"成功")
        ls *combined*.img.gz >/dev/null 2>&1 || { echo "!! rename 后未找到 combined 镜像"; ls -l | head -20; exit 1; }
        [ "$(ls -1 | wc -l)" -ge 2 ] || { echo "!! 发布目录资产少于 2 个"; exit 1; }
        [ -f "${GITHUB_WORKSPACE}/BUILD_SOURCE.txt" ] && cp "${GITHUB_WORKSPACE}/BUILD_SOURCE.txt" .
        [ -f "${GITHUB_WORKSPACE}/SOURCE_LOCK.txt" ] && cp "${GITHUB_WORKSPACE}/SOURCE_LOCK.txt" .
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "firmware_date=${date}" >> "$GITHUB_OUTPUT"
        echo "ota_enabled=${REGULAR_UPDATE}" >> "$GITHUB_OUTPUT"
        echo "BOT=TRUE" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_ENV

    - name: 上传固件
      # 2026-10-20: FIRMWARE 只在「整理文件」最后写入; 若该步中途失败而 status 仍为 success,
      # 原条件会让 env.FIRMWARE 展开成空 → path 变成以 / 开头的相对路径(行为不可预期)。补存在性判断。
      if: env.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && env.FIRMWARE != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ env.OpenWrt_name }}-${{ env.CODE }}-${{ env.TARGET_PROFILE }}-firmware-${{ env.Compile_Date }}
        path: ${{ env.FIRMWARE }}

    - name: 发布信息
      if: env.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        KERNEL_VER=$(egrep -o "KERNEL_PATCHVER:=[0-9]+\.[0-9]+" openwrt/target/linux/x86/Makefile | cut -d= -f2)
        KERNEL_FULL=$(egrep -o "LINUX_KERNEL_HASH-${KERNEL_VER}\.[0-9]+" openwrt/include/kernel-version.mk | cut -d- -f3)
        OPENCLASH_VER=$(grep -r "OPENCLASH_VERSION" openwrt/package/openclash/luci-app-openclash/Makefile 2>/dev/null | egrep -o "[0-9]+\.[0-9]+\.[0-9]+[^']*" | head -1)
        echo "## $(date +"%Y.%m.%d") OpenWrt x86 固件更新" > update_log.txt
        echo "" >> update_log.txt
        echo "- x86 固件版本：**${FIRMWARE_VER}** 内核版本：**${KERNEL_FULL:-${KERNEL_VER}}**" >> update_log.txt
        echo "- 1.软件同步到固件编译当天 OpenClash 更新至 v${OPENCLASH_VER:-latest}" >> update_log.txt
        echo "- 2. 从 18.06 旧版首次升级建议不保留配置；之后同版本链升级可用默认命令保留配置" >> update_log.txt
        echo "- **PVE虚拟** 平台 下载 **combined-efi.img** 镜像 然后在PVE下用命令 `qm importdisk 虚拟机编号 /var/lib/vz/template/iso/镜像文件.img local openwrt` 进行转换即可" >> update_log.txt
        echo "" >> update_log.txt
        echo "**x86 固件更新 方式：**" >> update_log.txt
        echo "" >> update_log.txt
        echo "1. 在**OP后台 系统--更新固件 点击 手动更新** 稍等几分钟 路由重启即可" >> update_log.txt
        echo "2. **命令行** 或 **SSH 链接** OP **执行以下命令** 完成固件更新" >> update_log.txt
        echo '- 执行 **`bash /bin/AutoUpdate.sh`** 保留配置更新（推荐）' >> update_log.txt
        echo '  Execute `bash /bin/AutoUpdate.sh` to update while keeping the current configuration.' >> update_log.txt
        echo '- 执行 **`bash /bin/AutoUpdate.sh -n`** 不保留配置更新（会不保留配置）' >> update_log.txt
        echo '  Execute `bash /bin/AutoUpdate.sh -n` to update without keeping the current configuration.' >> update_log.txt
        echo '' >> update_log.txt
        echo '> 默认命令会保留 `/etc/config`（LAN、PPPoE、ADH 等）；`-n` 不保留，适合全新安装或配置已损坏时。' >> update_log.txt
        echo "" >> update_log.txt
        echo "**注意：升级不会保留原有自己安装的 app ，还需升级后自行按需安装**" >> update_log.txt
        echo "" >> update_log.txt
        echo "**x86 OpenWrt 固件默认信息**" >> update_log.txt
        echo "" >> update_log.txt
        echo "| 默认登陆IP | 默认账号 | 默认密码 | SSH端口 |" >> update_log.txt
        echo "| ---- | ---- | ---- | ---- |" >> update_log.txt
        echo "| 192.168.50.2 | root | password | 12306 |" >> update_log.txt
        echo "" >> update_log.txt
        echo "> OpenClash 控制面板密码不再写死在仓库: 构建时由 secret OPENCLASH_DASH_PASS 注入, 未配置则随机生成 — 可在路由器执行 \`uci get openclash.@config[0].dashboard_password\` 查看" >> update_log.txt
        echo "> 本固件的源码/配置来源见同目录 BUILD_SOURCE.txt；最终配置快照见 SOURCE_LOCK.txt" >> update_log.txt
        echo "> 默认 root 密码为 password, 请首次登录后立即修改" >> update_log.txt
    - name: 发布固件
      # 2026-10-20: 同上, FIRMWARE 为空时 artifacts 通配会指向错误位置 → 补存在性判断
      if: env.status == 'success' && env.UPLOAD_RELEASE == 'true' && env.HAS_REPO_TOKEN == 'true' && env.FIRMWARE != ''
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        name: ${{ env.CODE }}-${{ env.TARGET_PROFILE }}
        tag: ${{ env.date }}
        token: ${{ secrets.REPO_TOKEN }}
        bodyFile: "update_log.txt"
        artifacts: "${{ env.FIRMWARE }}/*"
        # 2026-10-28: 默认 false —— 该 action 先创建"已发布"的 release 再逐个传资产,
        # 任一资产上传失败只打 warning, 于是线上留下空/半空 release 而 CI 是绿的。
        # 设为 true 后上传出问题直接让步骤失败, 失败日志也会被归档。
        artifactErrorsFailBuild: true

    - name: 准备 AutoUpdate 固件
      if: env.status == 'success' && env.REGULAR_UPDATE == 'true'
      run: |
       cd openwrt
       source "${PATH1}/upgrade.sh" && Diy_Part3
       # 2026-10-09: 为 AutoUpdate 通道的固件生成完整 SHA256 清单(<固件>.sha256)
       # 设备端 AutoUpdate.sh 优先用它做 64 位全量校验; 旧发布没有该文件时回落到文件名片段校验
       cd "${Home}/bin/Firmware"
       for f in *; do
         [ -f "$f" ] || continue
         case "$f" in *.sha256|*.sig) continue ;; esac
         sha256sum "$f" > "$f.sha256"
       done
       # 2026-10-24: 再发布一份总清单 sha256sums(按 bin/Firmware 里的最终文件名)。
       # 之前 targets 目录里那份清单记的是改名前的 openwrt-* 名字, 且从未随发布上传,
       # 用户拿到固件后只能逐个看 .sha256; 现在 `sha256sum -c sha256sums` 一条命令即可。
       rm -f sha256sums
       for f in *; do
         [ -f "$f" ] || continue
         case "$f" in *.sha256|*.sig|sha256sums) continue ;; esac
         sha256sum "$f" >> sha256sums
       done
       [ -s sha256sums ] || { echo "::error::sha256sums 未生成"; exit 1; }
       sha256sum -c sha256sums --quiet || { echo "::error::sha256sums 自检失败"; exit 1; }
       echo "== sha256sums 已生成(最终文件名, $(wc -l < sha256sums) 项) =="
       # 2026-10-29: 签名移到独立 job。构建 job 只准备待签名的 .sha256, 不持有私钥。
       [ -s "$(ls *.sha256 2>/dev/null | head -1)" ] || { echo "::error::没有生成任何 .sha256, 无法进入签名 job"; exit 1; }
       ls -l

    - name: 上传待签名固件
      if: env.status == 'success' && env.REGULAR_UPDATE == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: autoupdate-input
        path: openwrt/bin/Firmware
        if-no-files-found: error
        retention-days: 1

    - name: 电报通知
      if: env.status == 'success' && env.SERVERCHAN_SCKEY == 'true'
      run: |
        curl --data chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data "text=我亲爱的✨主人✨：您使用【${{matrix.target}}】文件夹编译的[${{ env.CODE }}-${{ env.TARGET_PROFILE }}]固件顺利编译完成了！💐" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          || echo "::warning::电报通知发送失败(不影响固件与发布)"

    - name: 失败取证(归档日志与配置)
      # 2026-10-20: 原为 if: failure() —— GitHub 的 failure() 在「作业被取消」时也不执行,
      # 而取消/超时同样需要现场。改为 !cancelled() 后由内部判断是否真有失败要归档;
      # 成功构建时只做一次瞬时判断, 行为与原来一致(成功就不归档)。
      if: ${{ !cancelled() }}
      run: |
        if [ "${{ job.status }}" = "success" ]; then echo "== 本次构建成功, 跳过失败取证 =="; exit 0; fi
        echo "== job.status=${{ job.status }} → 归档失败现场 =="
        # 2026-10-17: 失败时不再只能翻 20 万行 run 日志 —— 归档 openwrt/logs + 两份 .config +
        # BUILD_SOURCE, 并把错误签名聚合到 step summary(GitHub 日志只留 90 天, 且没人会去 grep)。
        OUT="$GITHUB_WORKSPACE/fail-diag"; mkdir -p "$OUT"
        cp BUILD_SOURCE.txt "$OUT/" 2>/dev/null || true
        cp "build/${{ matrix.target }}/.config" "$OUT/config.source" 2>/dev/null || true
        [ -f openwrt/.config ] && cp openwrt/.config "$OUT/config.generated" || true
        [ -d openwrt/logs ] && tar czf "$OUT/build-logs.tgz" openwrt/logs 2>/dev/null || true
        {
          echo "## 失败诊断 (run ${{ github.run_id }})"
          echo ""
          echo "- ref: ${{ github.ref_name }} / sha: ${{ github.sha }}"
          echo "- 构建指纹: ${CACHE_FP:-unknown}"
          echo "- 缓存命中: ${{ steps.cachecheck.outputs.hit }}"
          echo ""
          echo "### 环境与资源"
          echo '```'
          echo "[disk]"; df -h / /home/runner 2>/dev/null | tail -4
          echo "[mem]";  free -m | head -3
          echo "[dmesg]"; dmesg 2>/dev/null | grep -iE "oom|killed process|no space|error" | tail -10 || echo "(需 root, 跳过)"
          echo "[sizes]"; du -sh openwrt/staging_dir openwrt/build_dir openwrt/bin 2>/dev/null
          echo '```'
          echo ""
          echo "### 错误签名 Top20"
          echo '```'
          grep -rhoE 'make(\[[0-9]+\])?: \*\*\* \[[^]]+\] Error [0-9]+' openwrt/logs 2>/dev/null | sed 's/.*\[//' | sort | uniq -c | sort -rn | head -20 || echo "(openwrt/logs 无匹配, 见 build-logs.tgz)"
          echo '```'
          echo ""
          echo "### 最后一次 make 失败点"
          echo '```'
          ls -t openwrt/logs 2>/dev/null | head -5 || echo "(no logs dir)"
          echo '```'
        } > "$OUT/summary.md"
        cat "$OUT/summary.md" >> $GITHUB_STEP_SUMMARY
        du -sh "$OUT" 2>/dev/null || true

    - name: 上传失败日志
      # 2026-10-20: 与失败取证同步改为 !cancelled() —— 取证目录不存在时 if-no-files-found: warn 只告警
      if: ${{ !cancelled() && job.status != 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fail-diag-${{ github.run_id }}
        path: fail-diag
        if-no-files-found: warn
        retention-days: 14
  # 2026-10-29: 签名从 build job 拆出。build job 不持有 FIRMWARE_SIGN_KEY_B64；
  # sign job 在新 runner 上只处理 artifact，不执行构建树里的脚本。
  sign:
    needs: build
    if: needs.build.outputs.ota_enabled == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: 准备结束
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: 下载待签名固件
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: autoupdate-input
        path: fw

    - name: 签名并回验
      env:
        SIGN_KEY_B64: ${{ secrets.FIRMWARE_SIGN_KEY_B64 }}
      run: |
        set -euo pipefail
        cd fw
        [ -n "${SIGN_KEY_B64}" ] || { echo "::error::未配置 FIRMWARE_SIGN_KEY_B64"; exit 1; }
        [ -s sha256sums ] || { echo "::error::缺少 sha256sums"; exit 1; }
        sha256sum -c sha256sums --quiet || { echo "::error::待签名固件 sha256sums 校验失败"; exit 1; }
        ls *.sha256 >/dev/null 2>&1 || { echo "::error::没有 *.sha256 清单"; exit 1; }

        umask 077
        printf '%s' "${SIGN_KEY_B64}" | base64 -d > "${RUNNER_TEMP}/fw-signing.pem"
        chmod 600 "${RUNNER_TEMP}/fw-signing.pem"
        trap 'rm -f "${RUNNER_TEMP}/fw-signing.pem"' EXIT

        n=0
        for f in *.sha256; do
          [ -f "$f" ] || continue
          openssl pkeyutl -sign -rawin -inkey "${RUNNER_TEMP}/fw-signing.pem" -in "$f" -out "$f.sig"
          openssl pkeyutl -verify -pubin \
            -inkey "${GITHUB_WORKSPACE}/build/Lede_source/files/etc/firmware-signing.pub" \
            -rawin -in "$f" -sigfile "$f.sig" >/dev/null
          n=$((n + 1))
        done
        [ "${n}" -gt 0 ] || { echo "::error::没有生成任何 .sha256.sig"; exit 1; }
        ls -l

    - name: 上传签名产物
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: autoupdate-signed
        path: fw
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: [build, sign]
    if: needs.sign.result == 'success' && needs.build.outputs.has_repo_token == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: 下载签名产物
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: autoupdate-signed
        path: signed

    - name: 发布前校验
      run: |
        set -euo pipefail
        cd signed
        [ -s sha256sums ] || { echo "::error::缺少 sha256sums"; exit 1; }
        sha256sum -c sha256sums --quiet
        ls *.sha256.sig >/dev/null 2>&1 || { echo "::error::缺少 .sha256.sig"; exit 1; }

    - name: 生成版本索引
      env:
        VERSION_TAG: AutoUpdate-${{ needs.build.outputs.firmware_date }}
      run: |
        set -euo pipefail
        cd signed
        [ "${VERSION_TAG#AutoUpdate-}" != "" ] || { echo "::error::firmware_date 为空, 无法生成日期 tag"; exit 1; }
        {
          printf '{\n'
          printf '  "generated": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '  "channel": "AutoUpdate",\n'
          printf '  "release": "%s",\n' "${VERSION_TAG}"
          printf '  "assets": [\n'
          first=1
          for f in *; do
            case "$f" in versions.json|sha256sums|*.sig) continue ;; esac
            [ -f "$f" ] || continue
            [ "${first}" -eq 1 ] || printf ',\n'
            first=0
            printf '    {"name":"%s","size":%s,"sha256":"%s"}' \
              "$f" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done
          printf '\n  ]\n}\n'
        } > versions.json
        jq empty versions.json
        echo "== versions.json 已生成: $(wc -c < versions.json) bytes =="

    - name: 云端更新2
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
      with:
        repo_token: ${{ secrets.REPO_TOKEN }}
        file: signed/*
        # 2026-10-21 已合并回 main: 发布通道恢复生产 AutoUpdate(测试分支要改回 AutoUpdate-618-test)
        tag: AutoUpdate
        overwrite: true
        file_glob: true

    - name: 发布可回滚日期 tag
      # 2026-10-29: 生产 AutoUpdate tag 仍覆盖式更新; 同一批签名资产再发一份到
      # AutoUpdate-<编译时间>, 手工回滚时可按日期 tag 找旧固件, 不必只依赖资产名排序。
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
      with:
        repo_token: ${{ secrets.REPO_TOKEN }}
        file: signed/*
        tag: AutoUpdate-${{ needs.build.outputs.firmware_date }}
        overwrite: false
        file_glob: true

    - name: 云端更新3
      run: |
        mkdir -p Github_Tags
        cd Github_Tags
        # 2026-10-09: 先按严格 TLS 取, 失败才回退 --no-check-certificate 并显式告警(不再默认跳过证书校验)
        if ! wget -q --no-cookie --timeout=30 --tries=2 https://api.github.com/repos/${{github.repository}}/releases/tags/AutoUpdate -O Github_Tags; then
          echo "::warning::GitHub API 严格 TLS 拉取失败, 回退 --no-check-certificate 重试"
          wget -q --no-cookie --no-check-certificate --timeout=30 --tries=2 https://api.github.com/repos/${{github.repository}}/releases/tags/AutoUpdate -O Github_Tags
        fi
        [ -s Github_Tags ] || { echo "!! Github_Tags 为空, 设备端更新通道会读不到版本信息"; exit 1; }
        # 2026-10-22: 设备端 /usr/bin/AutoUpdate(luci-app-autoupdate 包内) 固定读
        # <release>/zzz_api, 而本工作流一直只上传 Github_Tags —— 名字对不上,
        # 于是"检查更新/一键升级"必然报 获取API数据失败。同一份 JSON 两个名字各传一份。
        cp -f Github_Tags zzz_api
        grep -q '"assets"' zzz_api || { echo "!! zzz_api 内容不是 release JSON"; exit 1; }

    - name: 云端更新4
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
      with:
        repo_token: ${{ secrets.REPO_TOKEN }}
        file: Github_Tags/*
        # 2026-10-21 已合并回 main: 同上, 写生产通道
        tag: AutoUpdate
        overwrite: true
        file_glob: true
