#
# 2026-10-21: 只监听本地回环, 不再对全网卡开放 19999。
# 原配置没有 "bind to", netdata 默认监听 0.0.0.0 与 :: (LAN/WAN 都能连, 是否放行
# 只靠下面 allow connections 的 IP 白名单)。要看面板请走 SSH 隧道:
#   ssh -p 12306 -L 19999:127.0.0.1:19999 root@192.168.50.2
# 然后本地浏览器打开 http://127.0.0.1:19999
#

[global]
	update every = 2
	memory deduplication (ksm) = no
	debug log = syslog
	error log = syslog
	access log = none
	run as user = root

[web]
	bind to = 127.0.0.1
	allow connections from = localhost 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.*
	allow dashboard from = localhost 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.*

[plugins]
	cgroups = no
	apps = no
	charts.d = yes
	fping = no
	node.d = no
	python.d = no

[health]
	enabled = no

[plugin:proc:ipc]
	shared memory totals = no
